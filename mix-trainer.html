<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mix Trainer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6e6e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            min-height: 100vh;
        }

        nav {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
        }
        nav a { color: #00d4ff; text-decoration: none; font-size: 14px; }
        nav a:hover { text-decoration: underline; }
        nav a.active { color: #e6e6e6; pointer-events: none; }

        h1 { font-size: 22px; margin-bottom: 12px; }

        .transport {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background: #161b22;
            color: #e6e6e6;
            border: 1px solid #333;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:active, button.active { background: #1f6feb; border-color: #58a6ff; }
        button.play-btn { background: #0f3460; border-color: #00d4ff; font-size: 16px; padding: 10px 24px; }

        .mixer {
            display: flex;
            gap: 4px;
            width: 100%;
            max-width: 1200px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .channel {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #161b22;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 10px 6px;
            min-width: 100px;
            flex: 1;
            gap: 6px;
        }

        .channel-name {
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .eq-btn {
            font-size: 10px;
            padding: 5px 8px;
            border-radius: 4px;
            width: 100%;
        }
        .eq-btn.has-eq { border-color: #4ade80; color: #4ade80; }

        .channel-btns {
            display: flex;
            gap: 4px;
        }
        .ch-btn {
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
        }
        .ch-btn.solo-on { background: #b45309; border-color: #f59e0b; color: #fff; }
        .ch-btn.mute-on { background: #991b1b; border-color: #f87171; color: #fff; }

        .fader-track {
            width: 14px;
            height: 160px;
            background: #222;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            border: 1px solid #333;
        }
        .fader-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1a4a7a;
            border-radius: 0 0 3px 3px;
        }
        .fader-unity {
            position: absolute;
            left: -3px;
            right: -3px;
            height: 1px;
            background: #58a6ff;
            bottom: 75%;
        }
        .fader-thumb {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 50%);
            width: 28px;
            height: 12px;
            background: #ccc;
            border-radius: 3px;
            cursor: grab;
            border: 1px solid #888;
        }
        .fader-val {
            font-size: 10px;
            color: #889;
        }
        .channel-icon {
            font-size: 20px;
            line-height: 1;
        }

        .send-row {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
        }
        .send-row label {
            font-size: 9px;
            color: #7a9;
            width: 22px;
        }
        .send-row input[type="range"] {
            flex: 1;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: #2a3a2a;
            border-radius: 2px;
            outline: none;
        }
        .send-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            cursor: pointer;
        }

        .reverb-master {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 12px;
            padding: 10px 15px;
            background: #161b22;
            border: 1px solid #222;
            border-radius: 8px;
            width: 100%;
            max-width: 1200px;
        }
        .reverb-master label {
            font-size: 12px;
            color: #7a9;
            font-weight: 600;
        }
        .reverb-master .rev-control {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .reverb-master .rev-control span {
            font-size: 11px;
            color: #889;
            width: 28px;
        }
        .reverb-master input[type="range"] {
            width: 100px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: #2a3a2a;
            border-radius: 2px;
            outline: none;
        }
        .reverb-master input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            cursor: pointer;
        }

        /* --- EQ Overlay --- */
        .eq-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .eq-overlay.open { display: flex; }

        .eq-panel {
            background: #0d1b2a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            width: 92%;
            max-width: 800px;
            position: relative;
        }
        .eq-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #889;
            background: none;
            border: none;
            padding: 5px 10px;
        }
        .eq-close:hover { color: #fff; }
        .eq-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .eq-canvas-wrap {
            width: 100%;
            margin-bottom: 12px;
            position: relative;
        }
        .eq-canvas-wrap canvas {
            width: 100%;
            height: 220px;
            background: #0a1220;
            border-radius: 6px;
            display: block;
            cursor: crosshair;
            touch-action: none;
        }

        .eq-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .eq-section {
            background: #0a1220;
            border-radius: 6px;
            padding: 10px;
        }
        .eq-section h3 {
            font-size: 12px;
            color: #889;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .eq-section h3 .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .eq-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .eq-row label {
            font-size: 11px;
            width: 30px;
            color: #aab;
        }
        .eq-row input[type="range"] {
            flex: 1;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            border-radius: 2px;
            outline: none;
        }
        .eq-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #58a6ff;
            cursor: pointer;
        }
        .eq-row .eq-readout {
            font-size: 10px;
            color: #667;
            width: 45px;
            text-align: right;
        }

        @media (max-width: 600px) {
            .eq-controls { grid-template-columns: 1fr; }
            .channel { min-width: 75px; padding: 8px 4px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">EQ Trainer</a>
        <a href="identify.html">Frequency Identify</a>
        <a href="mix-trainer.html" class="active">Mix Trainer</a>
    </nav>

    <h1>Mix Trainer</h1>

    <div class="transport">
        <button id="playBtn" class="play-btn">Play</button>
        <button id="refBtn">Reference</button>
    </div>

    <div class="mixer" id="mixer"></div>

    <div class="reverb-master">
        <label>Reverb</label>
        <div class="rev-control">
            <span>Decay</span>
            <input type="range" id="revDecay" min="0.3" max="4.0" step="0.1" value="1.5">
            <span id="revDecayVal">1.5s</span>
        </div>
        <div class="rev-control">
            <span>Mix</span>
            <input type="range" id="revMix" min="0" max="1" step="0.05" value="0.3">
            <span id="revMixVal">30%</span>
        </div>
    </div>

    <div class="eq-overlay" id="eqOverlay">
        <div class="eq-panel">
            <button class="eq-close" id="eqClose">&times;</button>
            <div class="eq-title" id="eqTitle">EQ</div>
            <div class="eq-canvas-wrap">
                <canvas id="eqCanvas"></canvas>
            </div>
            <div class="eq-controls">
                <div class="eq-section">
                    <h3><span class="dot" style="background:#f97316"></span>High-Pass</h3>
                    <div class="eq-row">
                        <label>Freq</label>
                        <input type="range" id="hpFreq" min="1.3" max="2.9" step="0.01" value="1.3">
                        <span class="eq-readout" id="hpFreqVal">20Hz</span>
                    </div>
                    <div class="eq-row">
                        <label>Q</label>
                        <input type="range" id="hpQ" min="-1.0" max="1.5" step="0.05" value="-0.5">
                        <span class="eq-readout" id="hpQVal">0.7</span>
                    </div>
                </div>
                <div class="eq-section">
                    <h3><span class="dot" style="background:#facc15"></span>Low Shelf</h3>
                    <div class="eq-row">
                        <label>Freq</label>
                        <input type="range" id="lsFreq" min="1.7" max="2.9" step="0.01" value="2.3">
                        <span class="eq-readout" id="lsFreqVal">200Hz</span>
                    </div>
                    <div class="eq-row">
                        <label>Gain</label>
                        <input type="range" id="lsGain" min="-12" max="12" step="0.5" value="0">
                        <span class="eq-readout" id="lsGainVal">0dB</span>
                    </div>
                </div>
                <div class="eq-section">
                    <h3><span class="dot" style="background:#4ade80"></span>Band</h3>
                    <div class="eq-row">
                        <label>Freq</label>
                        <input type="range" id="bandFreq" min="2.0" max="4.0" step="0.01" value="3.0">
                        <span class="eq-readout" id="bandFreqVal">1.0k</span>
                    </div>
                    <div class="eq-row">
                        <label>Gain</label>
                        <input type="range" id="bandGain" min="-12" max="12" step="0.5" value="0">
                        <span class="eq-readout" id="bandGainVal">0dB</span>
                    </div>
                    <div class="eq-row">
                        <label>Q</label>
                        <input type="range" id="bandQ" min="-1.0" max="2.5" step="0.05" value="0.3">
                        <span class="eq-readout" id="bandQVal">1.2</span>
                    </div>
                </div>
                <div class="eq-section">
                    <h3><span class="dot" style="background:#a78bfa"></span>High Shelf</h3>
                    <div class="eq-row">
                        <label>Freq</label>
                        <input type="range" id="hsFreq" min="3.3" max="4.2" step="0.01" value="3.7">
                        <span class="eq-readout" id="hsFreqVal">5.0k</span>
                    </div>
                    <div class="eq-row">
                        <label>Gain</label>
                        <input type="range" id="hsGain" min="-12" max="12" step="0.5" value="0">
                        <span class="eq-readout" id="hsGainVal">0dB</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const CHANNELS = [
            { id: 'lead-vocals', name: 'Lead Vox', icon: '\u{1F3A4}' },
            { id: 'backing-vocals', name: 'BV', icon: '\u{1F3B6}' },
            { id: 'piano', name: 'Piano', icon: '\u{1F3B9}' },
            { id: 'guitar-main', name: 'Guitar', icon: '\u{1F3B8}' },
            { id: 'guitar-overdub', name: 'Gtr OD', icon: '\u{1F3B8}' },
            { id: 'overhead', name: 'OH', icon: '\u{1FA87}' },
            { id: 'floor-tom', name: 'Floor Tom', icon: '\u{1F941}' },
        ];

        const NODE_COLORS = {
            hp: '#f97316',
            ls: '#facc15',
            band: '#4ade80',
            hs: '#a78bfa',
        };

        let audioCtx = null;
        let masterGain = null;
        let channels = {};
        let referenceBuffer = null;
        let referenceSource = null;
        let isPlaying = false;
        let isReference = false;
        let selectedChannel = null;

        const mixer = document.getElementById('mixer');
        const playBtn = document.getElementById('playBtn');
        const refBtn = document.getElementById('refBtn');
        const eqOverlay = document.getElementById('eqOverlay');
        const eqClose = document.getElementById('eqClose');
        const eqTitle = document.getElementById('eqTitle');
        const eqCanvas = document.getElementById('eqCanvas');
        const eqCtx = eqCanvas.getContext('2d');

        const sliders = {
            hpFreq: document.getElementById('hpFreq'),
            hpQ: document.getElementById('hpQ'),
            lsFreq: document.getElementById('lsFreq'),
            lsGain: document.getElementById('lsGain'),
            bandFreq: document.getElementById('bandFreq'),
            bandGain: document.getElementById('bandGain'),
            bandQ: document.getElementById('bandQ'),
            hsFreq: document.getElementById('hsFreq'),
            hsGain: document.getElementById('hsGain'),
        };
        const readouts = {
            hpFreq: document.getElementById('hpFreqVal'),
            hpQ: document.getElementById('hpQVal'),
            lsFreq: document.getElementById('lsFreqVal'),
            lsGain: document.getElementById('lsGainVal'),
            bandFreq: document.getElementById('bandFreqVal'),
            bandGain: document.getElementById('bandGainVal'),
            bandQ: document.getElementById('bandQVal'),
            hsFreq: document.getElementById('hsFreqVal'),
            hsGain: document.getElementById('hsGainVal'),
        };

        // --- Audio ---
        let reverbConvolver = null;
        let reverbReturn = null;
        let reverbSendBus = null;
        let reverbDecay = 1.5;
        let reverbMix = 0.3;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 1.0;
            masterGain.connect(audioCtx.destination);

            // Reverb bus: all send gains feed into this, which goes through convolver
            reverbSendBus = audioCtx.createGain();
            reverbConvolver = audioCtx.createConvolver();
            reverbReturn = audioCtx.createGain();
            reverbReturn.gain.value = reverbMix;
            reverbSendBus.connect(reverbConvolver);
            reverbConvolver.connect(reverbReturn);
            reverbReturn.connect(masterGain);

            generateImpulseResponse(reverbDecay);
        }

        function generateImpulseResponse(decay) {
            const length = Math.floor(audioCtx.sampleRate * Math.min(decay * 2, 6));
            const buffer = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const data = buffer.getChannelData(ch);
                for (let i = 0; i < length; i++) {
                    const t = i / audioCtx.sampleRate;
                    // Exponential decay with some early reflection texture
                    const env = Math.exp(-3 * t / decay);
                    // Diffuse noise + a couple of early reflections
                    let sample = (Math.random() * 2 - 1) * env;
                    if (i < audioCtx.sampleRate * 0.05) {
                        // Pre-delay + early reflections
                        sample *= 0.3;
                    }
                    data[i] = sample;
                }
            }
            reverbConvolver.buffer = buffer;
        }

        async function loadBuffer(name) {
            const resp = await fetch(`stems/${name}.mp3`);
            const buf = await resp.arrayBuffer();
            return await audioCtx.decodeAudioData(buf);
        }

        function defaultEQ() {
            return { hpFreq: 20, hpQ: 0.7, lsFreq: 200, lsGain: 0, bandFreq: 1000, bandGain: 0, bandQ: 2, hsFreq: 5000, hsGain: 0 };
        }

        async function loadAllStems() {
            initAudio();
            const loads = CHANNELS.map(async ch => {
                const buffer = await loadBuffer(ch.id);
                const hp = audioCtx.createBiquadFilter();
                hp.type = 'highpass'; hp.frequency.value = 20; hp.Q.value = 0.7;

                const ls = audioCtx.createBiquadFilter();
                ls.type = 'lowshelf'; ls.frequency.value = 200; ls.gain.value = 0;

                const band = audioCtx.createBiquadFilter();
                band.type = 'peaking'; band.frequency.value = 1000; band.gain.value = 0; band.Q.value = 2;

                const hs = audioCtx.createBiquadFilter();
                hs.type = 'highshelf'; hs.frequency.value = 5000; hs.gain.value = 0;

                const gain = audioCtx.createGain();
                gain.gain.value = 1.0;

                const sendGain = audioCtx.createGain();
                sendGain.gain.value = 0;

                channels[ch.id] = {
                    buffer, hp, ls, band, hs, gain, sendGain,
                    source: null,
                    vol: 1.0,
                    send: 0,
                    muted: false,
                    soloed: false,
                    eq: defaultEQ()
                };
            });
            await Promise.all(loads);
            referenceBuffer = await loadBuffer('reference-mix');
        }

        function startPlayback() {
            if (isReference) stopReference();
            const startTime = audioCtx.currentTime + 0.05;
            Object.entries(channels).forEach(([id, ch]) => {
                if (ch.source) { try { ch.source.stop(); } catch(e) {} }
                ch.source = audioCtx.createBufferSource();
                ch.source.buffer = ch.buffer;
                ch.source.loop = true;
                ch.source.connect(ch.hp);
                ch.hp.connect(ch.ls);
                ch.ls.connect(ch.band);
                ch.band.connect(ch.hs);
                ch.hs.connect(ch.gain);
                ch.gain.connect(masterGain);
                ch.hs.connect(ch.sendGain);
                ch.sendGain.connect(reverbSendBus);
                ch.source.start(startTime);
            });
            updateGains();
            isPlaying = true;
            playBtn.textContent = 'Stop';
            playBtn.classList.add('active');
        }

        function stopPlayback() {
            Object.values(channels).forEach(ch => {
                if (ch.source) {
                    try { ch.source.stop(); } catch(e) {}
                    try { ch.source.disconnect(); } catch(e) {}
                    ch.source = null;
                }
            });
            isPlaying = false;
            playBtn.textContent = 'Play';
            playBtn.classList.remove('active');
        }

        function startReference() {
            if (isPlaying) stopPlayback();
            referenceSource = audioCtx.createBufferSource();
            referenceSource.buffer = referenceBuffer;
            referenceSource.loop = true;
            referenceSource.connect(masterGain);
            referenceSource.start();
            isReference = true;
            refBtn.classList.add('active');
        }

        function stopReference() {
            if (referenceSource) {
                try { referenceSource.stop(); } catch(e) {}
                referenceSource = null;
            }
            isReference = false;
            refBtn.classList.remove('active');
        }

        function updateGains() {
            const anySoloed = Object.values(channels).some(ch => ch.soloed);
            Object.values(channels).forEach(ch => {
                if (anySoloed) {
                    ch.gain.gain.value = ch.soloed ? ch.vol : 0;
                } else {
                    ch.gain.gain.value = ch.muted ? 0 : ch.vol;
                }
            });
        }

        function applyEQ(id) {
            const ch = channels[id];
            if (!ch) return;
            ch.hp.frequency.value = Math.max(20, ch.eq.hpFreq);
            ch.hp.Q.value = ch.eq.hpQ;
            ch.ls.frequency.value = ch.eq.lsFreq;
            ch.ls.gain.value = ch.eq.lsGain;
            ch.band.frequency.value = ch.eq.bandFreq;
            ch.band.gain.value = ch.eq.bandGain;
            ch.band.Q.value = ch.eq.bandQ;
            ch.hs.frequency.value = ch.eq.hsFreq;
            ch.hs.gain.value = ch.eq.hsGain;
        }

        // --- Fader: 0dB at 75%, +12dB at top, -inf at bottom ---
        function pctToGain(pct) {
            if (pct <= 0) return 0;
            const dB = (pct - 0.75) * (12 / 0.25) * (pct > 0.75 ? 1 : (pct / 0.75) > 0 ? 20 * Math.log10(pct / 0.75) / (20 * Math.log10(1)) : -Infinity);
            // Simpler: linear in dB. Bottom=silence, 75%=0dB, 100%=+12dB
            const dBval = pct <= 0.001 ? -Infinity : -48 + (pct / 0.75) * 48;
            // Actually let's do it cleanly:
            // 0% = -inf, 75% = 0dB, 100% = +12dB
            if (pct <= 0) return 0;
            if (pct <= 0.75) {
                // Map 0-0.75 to -60dB to 0dB (exponential)
                const dbRange = 60;
                const db = -dbRange * (1 - pct / 0.75);
                return Math.pow(10, db / 20);
            } else {
                // Map 0.75-1.0 to 0dB to +12dB
                const db = ((pct - 0.75) / 0.25) * 12;
                return Math.pow(10, db / 20);
            }
        }
        function gainToDb(gain) {
            if (gain <= 0) return '-∞';
            return (20 * Math.log10(gain)).toFixed(1);
        }
        function gainToPct(gain) {
            if (gain <= 0) return 0;
            const db = 20 * Math.log10(gain);
            if (db <= 0) {
                return 0.75 * (1 + db / 60);
            } else {
                return 0.75 + (db / 12) * 0.25;
            }
        }

        // --- Mixer UI ---
        let activeFader = null;
        document.addEventListener('mousemove', (e) => { if (activeFader) activeFader(e); });
        document.addEventListener('touchmove', (e) => { if (activeFader) activeFader(e); }, { passive: false });
        document.addEventListener('mouseup', () => { activeFader = null; });
        document.addEventListener('touchend', () => { activeFader = null; });

        function buildMixer() {
            mixer.innerHTML = '';
            CHANNELS.forEach(ch => {
                const col = document.createElement('div');
                col.className = 'channel';

                const name = document.createElement('div');
                name.className = 'channel-name';
                name.textContent = ch.name;

                const eqBtn = document.createElement('button');
                eqBtn.className = 'eq-btn';
                eqBtn.textContent = 'EQ';
                eqBtn.dataset.id = ch.id;
                eqBtn.addEventListener('click', () => openEQ(ch.id));

                const btns = document.createElement('div');
                btns.className = 'channel-btns';
                const soloBtn = document.createElement('button');
                soloBtn.className = 'ch-btn';
                soloBtn.textContent = 'S';
                soloBtn.addEventListener('click', () => {
                    channels[ch.id].soloed = !channels[ch.id].soloed;
                    soloBtn.classList.toggle('solo-on', channels[ch.id].soloed);
                    updateGains();
                });
                const muteBtn = document.createElement('button');
                muteBtn.className = 'ch-btn';
                muteBtn.textContent = 'M';
                muteBtn.addEventListener('click', () => {
                    channels[ch.id].muted = !channels[ch.id].muted;
                    muteBtn.classList.toggle('mute-on', channels[ch.id].muted);
                    updateGains();
                });
                btns.appendChild(soloBtn);
                btns.appendChild(muteBtn);

                const faderTrack = document.createElement('div');
                faderTrack.className = 'fader-track';
                const faderFill = document.createElement('div');
                faderFill.className = 'fader-fill';
                faderFill.style.height = '75%';
                const faderUnity = document.createElement('div');
                faderUnity.className = 'fader-unity';
                const faderThumb = document.createElement('div');
                faderThumb.className = 'fader-thumb';
                faderThumb.style.bottom = '75%';
                faderTrack.appendChild(faderFill);
                faderTrack.appendChild(faderUnity);
                faderTrack.appendChild(faderThumb);

                const faderVal = document.createElement('div');
                faderVal.className = 'fader-val';
                faderVal.textContent = '0.0dB';

                const icon = document.createElement('div');
                icon.className = 'channel-icon';
                icon.textContent = ch.icon;

                function setFader(e) {
                    const rect = faderTrack.getBoundingClientRect();
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    const pct = 1 - Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
                    const gain = pctToGain(pct);
                    channels[ch.id].vol = gain;
                    faderFill.style.height = (pct * 100) + '%';
                    faderThumb.style.bottom = (pct * 100) + '%';
                    faderVal.textContent = gain < 0.001 ? '-∞dB' : gainToDb(gain) + 'dB';
                    updateGains();
                }
                faderTrack.addEventListener('mousedown', (e) => { activeFader = setFader; setFader(e); });
                faderTrack.addEventListener('touchstart', (e) => { activeFader = setFader; setFader(e); e.preventDefault(); });

                // Send knob
                const sendRow = document.createElement('div');
                sendRow.className = 'send-row';
                const sendLabel = document.createElement('label');
                sendLabel.textContent = 'Rev';
                const sendSlider = document.createElement('input');
                sendSlider.type = 'range';
                sendSlider.min = '0';
                sendSlider.max = '1';
                sendSlider.step = '0.05';
                sendSlider.value = '0';
                sendSlider.addEventListener('input', () => {
                    const val = parseFloat(sendSlider.value);
                    if (channels[ch.id]) {
                        channels[ch.id].send = val;
                        channels[ch.id].sendGain.gain.value = val;
                    }
                });
                sendRow.appendChild(sendLabel);
                sendRow.appendChild(sendSlider);

                col.appendChild(name);
                col.appendChild(eqBtn);
                col.appendChild(btns);
                col.appendChild(faderTrack);
                col.appendChild(faderVal);
                col.appendChild(sendRow);
                col.appendChild(icon);
                mixer.appendChild(col);
            });
        }

        // --- EQ Panel ---
        async function openEQ(id) {
            if (!channels[id]) {
                await ensureLoaded();
            }
            selectedChannel = id;
            const info = CHANNELS.find(c => c.id === id);
            eqTitle.textContent = info.name + ' — EQ';
            syncSlidersFromEQ();
            updateEQReadouts();
            eqOverlay.classList.add('open');
            requestAnimationFrame(() => drawEQCurve());
        }

        function closeEQ() {
            eqOverlay.classList.remove('open');
            selectedChannel = null;
            updateEQButtons();
        }

        function syncSlidersFromEQ() {
            if (!selectedChannel) return;
            const eq = channels[selectedChannel].eq;
            sliders.hpFreq.value = Math.log10(eq.hpFreq);
            sliders.hpQ.value = Math.log2(eq.hpQ);
            sliders.lsFreq.value = Math.log10(eq.lsFreq);
            sliders.lsGain.value = eq.lsGain;
            sliders.bandFreq.value = Math.log10(eq.bandFreq);
            sliders.bandGain.value = eq.bandGain;
            sliders.bandQ.value = Math.log2(eq.bandQ);
            sliders.hsFreq.value = Math.log10(eq.hsFreq);
            sliders.hsGain.value = eq.hsGain;
        }

        function updateEQReadouts() {
            const eq = selectedChannel ? channels[selectedChannel].eq : defaultEQ();
            readouts.hpFreq.textContent = fmtFreq(eq.hpFreq);
            readouts.hpQ.textContent = eq.hpQ.toFixed(1);
            readouts.lsFreq.textContent = fmtFreq(eq.lsFreq);
            readouts.lsGain.textContent = fmtGain(eq.lsGain);
            readouts.bandFreq.textContent = fmtFreq(eq.bandFreq);
            readouts.bandGain.textContent = fmtGain(eq.bandGain);
            readouts.bandQ.textContent = eq.bandQ.toFixed(1);
            readouts.hsFreq.textContent = fmtFreq(eq.hsFreq);
            readouts.hsGain.textContent = fmtGain(eq.hsGain);
        }

        function fmtFreq(f) { return f >= 1000 ? (f / 1000).toFixed(1) + 'k' : Math.round(f) + ''; }
        function fmtGain(g) { return (g >= 0 ? '+' : '') + g.toFixed(1) + 'dB'; }

        function saveEQFromSliders() {
            if (!selectedChannel) return;
            const eq = channels[selectedChannel].eq;
            eq.hpFreq = Math.pow(10, parseFloat(sliders.hpFreq.value));
            eq.hpQ = Math.pow(2, parseFloat(sliders.hpQ.value));
            eq.lsFreq = Math.pow(10, parseFloat(sliders.lsFreq.value));
            eq.lsGain = parseFloat(sliders.lsGain.value);
            eq.bandFreq = Math.pow(10, parseFloat(sliders.bandFreq.value));
            eq.bandGain = parseFloat(sliders.bandGain.value);
            eq.bandQ = Math.pow(2, parseFloat(sliders.bandQ.value));
            eq.hsFreq = Math.pow(10, parseFloat(sliders.hsFreq.value));
            eq.hsGain = parseFloat(sliders.hsGain.value);
            applyEQ(selectedChannel);
            updateEQReadouts();
            drawEQCurve();
        }

        function updateEQButtons() {
            document.querySelectorAll('.eq-btn').forEach(btn => {
                const ch = channels[btn.dataset.id];
                if (!ch) return;
                const eq = ch.eq;
                const hasEQ = eq.hpFreq > 25 || Math.abs(eq.lsGain) > 0.5 || Math.abs(eq.bandGain) > 0.5 || Math.abs(eq.hsGain) > 0.5;
                btn.classList.toggle('has-eq', hasEQ);
            });
        }

        Object.values(sliders).forEach(s => s.addEventListener('input', saveEQFromSliders));
        eqClose.addEventListener('click', closeEQ);
        eqOverlay.addEventListener('click', (e) => { if (e.target === eqOverlay) closeEQ(); });

        // --- EQ Curve Drawing with Draggable Nodes ---
        const FREQ_MIN = 20, FREQ_MAX = 20000;
        const DB_MIN = -18, DB_MAX = 18;

        function freqToX(f, pad, gw) {
            return pad.left + ((Math.log10(f) - Math.log10(FREQ_MIN)) / (Math.log10(FREQ_MAX) - Math.log10(FREQ_MIN))) * gw;
        }
        function xToFreq(x, pad, gw) {
            const ratio = (x - pad.left) / gw;
            return Math.pow(10, Math.log10(FREQ_MIN) + ratio * (Math.log10(FREQ_MAX) - Math.log10(FREQ_MIN)));
        }
        function dbToY(db, pad, gh) {
            return pad.top + ((DB_MAX - db) / (DB_MAX - DB_MIN)) * gh;
        }
        function yToDb(y, pad, gh) {
            return DB_MAX - ((y - pad.top) / gh) * (DB_MAX - DB_MIN);
        }

        function getFilterResponse(type, freq, gain, q, freqArray) {
            if (!audioCtx) return new Array(freqArray.length).fill(0);
            if ((type === 'lowshelf' || type === 'highshelf') && Math.abs(gain) < 0.01) {
                return new Array(freqArray.length).fill(0);
            }
            const f = audioCtx.createBiquadFilter();
            f.type = type;
            f.frequency.value = freq;
            if (type === 'peaking') f.Q.value = q;
            if (type === 'highpass') f.Q.value = q;
            if (type === 'peaking' || type === 'lowshelf' || type === 'highshelf') f.gain.value = gain;
            const mag = new Float32Array(freqArray.length);
            const phase = new Float32Array(freqArray.length);
            f.getFrequencyResponse(freqArray, mag, phase);
            return Array.from(mag).map(m => 20 * Math.log10(m));
        }

        function drawEQCurve() {
            if (!selectedChannel || !audioCtx) return;
            const eq = channels[selectedChannel].eq;

            const dpr = window.devicePixelRatio || 1;
            const rect = eqCanvas.getBoundingClientRect();
            eqCanvas.width = rect.width * dpr;
            eqCanvas.height = rect.height * dpr;
            eqCtx.scale(dpr, dpr);

            const w = rect.width;
            const h = rect.height;
            const pad = { top: 15, bottom: 25, left: 40, right: 15 };
            const gw = w - pad.left - pad.right;
            const gh = h - pad.top - pad.bottom;

            eqCtx.fillStyle = '#0a1220';
            eqCtx.fillRect(0, 0, w, h);

            // Grid
            eqCtx.font = '10px sans-serif';
            const freqLabels = [50, 100, 200, 500, 1000, 2000, 5000, 10000];
            eqCtx.fillStyle = '#334';
            eqCtx.strokeStyle = '#1a2535';
            eqCtx.lineWidth = 1;
            freqLabels.forEach(f => {
                const x = freqToX(f, pad, gw);
                eqCtx.beginPath(); eqCtx.moveTo(x, pad.top); eqCtx.lineTo(x, h - pad.bottom); eqCtx.stroke();
                const label = f >= 1000 ? (f / 1000) + 'k' : f.toString();
                eqCtx.fillText(label, x - 8, h - pad.bottom + 12);
            });

            [-12, -6, 0, 6, 12].forEach(g => {
                const y = dbToY(g, pad, gh);
                eqCtx.strokeStyle = g === 0 ? '#2a3a4a' : '#1a2535';
                eqCtx.lineWidth = g === 0 ? 1.5 : 1;
                eqCtx.beginPath(); eqCtx.moveTo(pad.left, y); eqCtx.lineTo(w - pad.right, y); eqCtx.stroke();
                eqCtx.fillStyle = '#445';
                eqCtx.fillText(g + 'dB', 5, y + 3);
            });

            // Compute responses
            const numPts = 300;
            const freqArray = new Float32Array(numPts);
            for (let i = 0; i < numPts; i++) freqArray[i] = FREQ_MIN * Math.pow(FREQ_MAX / FREQ_MIN, i / (numPts - 1));

            const hpR = getFilterResponse('highpass', eq.hpFreq, 0, eq.hpQ, freqArray);
            const lsR = getFilterResponse('lowshelf', eq.lsFreq, eq.lsGain, 0, freqArray);
            const bandR = getFilterResponse('peaking', eq.bandFreq, eq.bandGain, eq.bandQ, freqArray);
            const hsR = getFilterResponse('highshelf', eq.hsFreq, eq.hsGain, 0, freqArray);

            // Individual curves (faint)
            const curves = [
                { resp: hpR, color: NODE_COLORS.hp },
                { resp: lsR, color: NODE_COLORS.ls },
                { resp: bandR, color: NODE_COLORS.band },
                { resp: hsR, color: NODE_COLORS.hs },
            ];
            curves.forEach(({ resp, color }) => {
                const hasEffect = resp.some(v => Math.abs(v) > 0.1);
                if (!hasEffect) return;
                eqCtx.beginPath();
                eqCtx.strokeStyle = color + '44';
                eqCtx.lineWidth = 1.5;
                for (let i = 0; i < numPts; i++) {
                    const x = pad.left + (i / (numPts - 1)) * gw;
                    const y = Math.max(pad.top, Math.min(pad.top + gh, dbToY(resp[i], pad, gh)));
                    if (i === 0) eqCtx.moveTo(x, y); else eqCtx.lineTo(x, y);
                }
                eqCtx.stroke();
            });

            // Combined curve
            eqCtx.beginPath();
            eqCtx.strokeStyle = '#00d4ff';
            eqCtx.lineWidth = 2.5;
            for (let i = 0; i < numPts; i++) {
                const total = hpR[i] + lsR[i] + bandR[i] + hsR[i];
                const x = pad.left + (i / (numPts - 1)) * gw;
                const y = Math.max(pad.top, Math.min(pad.top + gh, dbToY(total, pad, gh)));
                if (i === 0) eqCtx.moveTo(x, y); else eqCtx.lineTo(x, y);
            }
            eqCtx.stroke();

            // Draggable nodes
            const nodes = getNodePositions(eq, pad, gw, gh);
            nodes.forEach(n => {
                eqCtx.beginPath();
                eqCtx.arc(n.x, n.y, 8, 0, Math.PI * 2);
                eqCtx.fillStyle = n.color;
                eqCtx.fill();
                eqCtx.strokeStyle = '#fff';
                eqCtx.lineWidth = 1.5;
                eqCtx.stroke();
            });
        }

        function getNodePositions(eq, pad, gw, gh) {
            // HP node: position at HP freq, on the -3dB line relative to 0
            const hpX = freqToX(eq.hpFreq, pad, gw);
            const hpY = dbToY(-3, pad, gh);
            // LS node: at ls freq, ls gain
            const lsX = freqToX(eq.lsFreq, pad, gw);
            const lsY = dbToY(eq.lsGain, pad, gh);
            // Band node: at band freq, band gain
            const bandX = freqToX(eq.bandFreq, pad, gw);
            const bandY = dbToY(eq.bandGain, pad, gh);
            // HS node: at hs freq, hs gain
            const hsX = freqToX(eq.hsFreq, pad, gw);
            const hsY = dbToY(eq.hsGain, pad, gh);

            return [
                { key: 'hp', x: hpX, y: hpY, color: NODE_COLORS.hp },
                { key: 'ls', x: lsX, y: lsY, color: NODE_COLORS.ls },
                { key: 'band', x: bandX, y: bandY, color: NODE_COLORS.band },
                { key: 'hs', x: hsX, y: hsY, color: NODE_COLORS.hs },
            ];
        }

        // --- Canvas Drag Interaction ---
        let dragNode = null;

        function getCanvasCoords(e) {
            const rect = eqCanvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            return { x, y };
        }

        function canvasDown(e) {
            if (!selectedChannel) return;
            const { x, y } = getCanvasCoords(e);
            const eq = channels[selectedChannel].eq;
            const rect = eqCanvas.getBoundingClientRect();
            const pad = { top: 15, bottom: 25, left: 40, right: 15 };
            const gw = rect.width - pad.left - pad.right;
            const gh = rect.height - pad.top - pad.bottom;
            const nodes = getNodePositions(eq, pad, gw, gh);

            let closest = null, closestDist = 30;
            nodes.forEach(n => {
                const d = Math.sqrt((n.x - x) ** 2 + (n.y - y) ** 2);
                if (d < closestDist) { closest = n; closestDist = d; }
            });

            if (closest) {
                dragNode = closest.key;
                e.preventDefault();
            }
        }

        function canvasMove(e) {
            if (!dragNode || !selectedChannel) return;
            e.preventDefault();
            const { x, y } = getCanvasCoords(e);
            const rect = eqCanvas.getBoundingClientRect();
            const pad = { top: 15, bottom: 25, left: 40, right: 15 };
            const gw = rect.width - pad.left - pad.right;
            const gh = rect.height - pad.top - pad.bottom;

            const freq = Math.max(FREQ_MIN, Math.min(FREQ_MAX, xToFreq(x, pad, gw)));
            const db = Math.max(DB_MIN, Math.min(DB_MAX, yToDb(y, pad, gh)));
            const eq = channels[selectedChannel].eq;

            if (dragNode === 'hp') {
                eq.hpFreq = Math.max(20, Math.min(800, freq));
            } else if (dragNode === 'ls') {
                eq.lsFreq = Math.max(50, Math.min(800, freq));
                eq.lsGain = Math.max(-12, Math.min(12, db));
            } else if (dragNode === 'band') {
                eq.bandFreq = Math.max(100, Math.min(12000, freq));
                eq.bandGain = Math.max(-12, Math.min(12, db));
            } else if (dragNode === 'hs') {
                eq.hsFreq = Math.max(2000, Math.min(16000, freq));
                eq.hsGain = Math.max(-12, Math.min(12, db));
            }

            applyEQ(selectedChannel);
            syncSlidersFromEQ();
            updateEQReadouts();
            drawEQCurve();
        }

        function canvasUp() {
            dragNode = null;
        }

        eqCanvas.addEventListener('mousedown', canvasDown);
        eqCanvas.addEventListener('touchstart', canvasDown, { passive: false });
        document.addEventListener('mousemove', canvasMove);
        document.addEventListener('touchmove', canvasMove, { passive: false });
        document.addEventListener('mouseup', canvasUp);
        document.addEventListener('touchend', canvasUp);

        // Scroll wheel: adjusts Q of nearest node (band Q, or HP Q), or gain for shelves
        eqCanvas.addEventListener('wheel', (e) => {
            if (!selectedChannel) return;
            e.preventDefault();
            const { x, y } = getCanvasCoords(e);
            const eq = channels[selectedChannel].eq;
            const rect = eqCanvas.getBoundingClientRect();
            const pad = { top: 15, bottom: 25, left: 40, right: 15 };
            const gw = rect.width - pad.left - pad.right;
            const gh = rect.height - pad.top - pad.bottom;
            const nodes = getNodePositions(eq, pad, gw, gh);

            let closest = null, closestDist = Infinity;
            nodes.forEach(n => {
                const d = Math.sqrt((n.x - x) ** 2 + (n.y - y) ** 2);
                if (d < closestDist) { closest = n; closestDist = d; }
            });
            if (!closest) return;

            const delta = e.deltaY > 0 ? -0.5 : 0.5;

            if (closest.key === 'hp') {
                eq.hpQ = Math.max(0.3, Math.min(8, eq.hpQ * Math.pow(2, delta * 0.3)));
            } else if (closest.key === 'band') {
                eq.bandQ = Math.max(0.3, Math.min(12, eq.bandQ * Math.pow(2, delta * 0.3)));
            } else if (closest.key === 'ls') {
                eq.lsGain = Math.max(-12, Math.min(12, eq.lsGain + delta));
            } else if (closest.key === 'hs') {
                eq.hsGain = Math.max(-12, Math.min(12, eq.hsGain + delta));
            }

            applyEQ(selectedChannel);
            syncSlidersFromEQ();
            updateEQReadouts();
            drawEQCurve();
        }, { passive: false });

        // --- Transport ---
        playBtn.addEventListener('click', async () => {
            initAudio();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            if (!Object.keys(channels).length) await loadAllStems();
            if (isReference) stopReference();
            if (isPlaying) stopPlayback(); else startPlayback();
        });

        refBtn.addEventListener('click', async () => {
            initAudio();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            if (!referenceBuffer) {
                if (!Object.keys(channels).length) await loadAllStems();
                else referenceBuffer = await loadBuffer('reference-mix');
            }
            if (isReference) {
                stopReference();
                if (Object.keys(channels).length) startPlayback();
            } else {
                startReference();
            }
        });

        // --- Reverb master controls ---
        const revDecaySlider = document.getElementById('revDecay');
        const revDecayVal = document.getElementById('revDecayVal');
        const revMixSlider = document.getElementById('revMix');
        const revMixVal = document.getElementById('revMixVal');

        revDecaySlider.addEventListener('input', () => {
            reverbDecay = parseFloat(revDecaySlider.value);
            revDecayVal.textContent = reverbDecay.toFixed(1) + 's';
            if (audioCtx) generateImpulseResponse(reverbDecay);
        });
        revMixSlider.addEventListener('input', () => {
            reverbMix = parseFloat(revMixSlider.value);
            revMixVal.textContent = Math.round(reverbMix * 100) + '%';
            if (reverbReturn) reverbReturn.gain.value = reverbMix;
        });

        // --- Boot ---
        buildMixer();
        let loaded = false;
        async function ensureLoaded() {
            if (loaded) return;
            loaded = true;
            initAudio();
            await loadAllStems();
            updateEQButtons();
        }
        document.addEventListener('click', ensureLoaded, { once: true });
        document.addEventListener('touchstart', ensureLoaded, { once: true });
    })();
    </script>
</body>
</html>
